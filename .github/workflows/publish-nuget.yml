name: Publish NuGet

# Publica os pacotes SankhyaAPI.Client e SankhyaAPI.Client.Testing no nuget.org quando uma tag vX.Y.Z é enviada.
# A tag precisa apontar para um commit que já está na main.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  id-token: write   # OIDC para o Trusted Publishing do nuget.org

env:
  # O generator vai dentro do pacote do cliente; o Testing é publicado à parte.
  PROJECTS: SankhyaAPI.Client/SankhyaAPI.Client.csproj SankhyaAPI.Client.Testing/SankhyaAPI.Client.Testing.csproj
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que a tag está na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME não aponta para um commit da main."
            exit 1
          fi

      - name: Extrair versão da tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          for p in $PROJECTS; do
            dotnet pack "$p" --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./artifacts
          done

      # Trusted Publishing: troca o token OIDC do GitHub por uma chave de curta duração no nuget.org,
      # sem secret guardado no repositório. As políticas no nuget.org cobrem os dois pacotes.
      - name: Login no NuGet (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: samueldias21

      - name: Publicar no nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::O login do Trusted Publishing não devolveu a chave."
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --skip-duplicate

      - name: Guardar pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
